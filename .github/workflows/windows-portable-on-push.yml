# Windows portable zip only on push (no installer, no GitHub secrets).

name: Windows portable (push)

on:
  push:
    branches:
      - "**"

concurrency:
  group: windows-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No pnpm-lock.yaml in repo; frozen install would fail CI
      - run: pnpm install
      - name: Read version
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - run: pnpm run package
      - name: Generate portable
        run: |
          New-Item -ItemType Directory -Path "./out/MusicFree-win32-x64/portable" -Force
      - name: Archive portable
        run: |
          Compress-Archive -Path "./out/MusicFree-win32-x64/*" -DestinationPath "./out/MusicFree-${{ env.VERSION }}-win32-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-${{ env.VERSION }}-win32-x64-portable-${{ github.sha }}
          path: ./out/MusicFree-${{ env.VERSION }}-win32-x64-portable.zip
          retention-days: 14
