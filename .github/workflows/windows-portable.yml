name: Windows Portable

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-portable:
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: "2022"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node-gyp (native rebuilds) uses GYP, which imports distutils; not in Python 3.12+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # electron-forge prePackage rebuilds better-sqlite3 via node-gyp (needs cl.exe).
      - name: Setup MSVC for native module rebuilds
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - name: Read version
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - run: npm run package
      - name: Generate portable marker
        run: |
          New-Item -ItemType Directory -Path "./out/MusicFree-win32-x64/portable" -Force
      - name: Archive portable
        run: |
          Compress-Archive -Path "./out/MusicFree-win32-x64/*" -DestinationPath "./out/MusicFree-${{ env.VERSION }}-win32-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-${{ env.VERSION }}-win32-x64-portable
          path: ./out/MusicFree-${{ env.VERSION }}-win32-x64-portable.zip
          retention-days: 30
